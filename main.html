<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            gap: 12px;
        }
        input[type="text"],
        input[type="password"] {
            padding: 8px;
            font-size: 14px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #existing {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            width: 300px;
        }
        #existing:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Login Form</h1>
    
    <form id="loginForm">
        <input type="text" placeholder="Username" id="username">
        <input type="password" placeholder="Password" id="password">
        
        <div class="checkbox-container">
            <input type="checkbox" id="checkbox">
            <label for="checkbox">Remember me.</label>
        </div>
        
        <input type="submit" id="submit" value="Submit">
    </form>

    <button id="existing">Login as existing user</button>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const checkbox = document.getElementById('checkbox');
        const existingBtn = document.getElementById('existing');

        // 1. Check localStorage on page load to persist state
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('username');
            if (savedUsername) {
                existingBtn.style.display = 'block';
            }
        });

        // 2. Handle form submission logic
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent actual page refresh for smooth testing
            
            const username = usernameInput.value;
            const password = passwordInput.value;

            // Trigger required alert
            alert(`Logged in as ${username}`);

            // Handle "Remember Me" checkbox states
            if (checkbox.checked) {
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);
                existingBtn.style.display = 'block'; // Ensure button appears if checked and submitted
            } else {
                localStorage.removeItem('username');
                localStorage.removeItem('password');
                existingBtn.style.display = 'none';
            }
        });

        // 3. Handle login as existing user click
        existingBtn.addEventListener('click', () => {
            const savedUsername = localStorage.getItem('username');
            if (savedUsername) {
                alert(`Logged in as ${savedUsername}`);
            }
        });
    </script>
</body>
</html>
